name: Release Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build installers & publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          # ยังไม่มี package.json/pyproject — ติดตั้งเฉพาะ deps ที่ build ต้องการ (ถ้ามี)

      - name: Build Pi OS (.deb) installer
        run: |
          python packaging/build_installers.py --platform pi
          ls -la packaging/dist

      - name: Determine release tag
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}"
          else
            echo "tag=${GITHUB_REF_NAME}"
          fi

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SNC ${{ steps.version.outputs.tag }}
          body: |
            ## Smart Nurse Call — Installers

            Build จาก `packaging/build_installers.py` (Pi OS ARM64).

            > สคริปต์นี้ build เฉพาะ `.deb` (รันบน Ubuntu) — สำหรับ Windows `.exe` (Inno Setup) และ
            > macOS `.dmg/.pkg` (py2app) ต้อง build บนเครื่องเป้าหมายตาม `packaging/INSTALL.md`
          files: |
            packaging/dist/snclite_*_arm64.deb
            packaging/dist/download_manifest.json
          draft: true