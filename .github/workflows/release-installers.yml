name: Release Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build installers & publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          # ยังไม่มี package.json/pyproject — ติดตั้งเฉพาะ deps ที่ build ต้องการ (ถ้ามี)

      - name: Determine release tag
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.version }}"
          if [ -z "${TAG}" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ -z "${TAG}" ]; then
            echo "::error::Cannot determine release tag — pass 'version' input (workflow_dispatch) or push a tag (v*)"
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build Pi OS (.deb) installer
        run: |
          python packaging/build_installers.py --platform pi --version ${{ steps.version.outputs.tag }}
          ls -la packaging/dist

      - name: Verify build artifacts
        shell: bash
        run: |
          set -uo pipefail
          DEB="$(ls packaging/dist/snclite_*_arm64.deb 2>/dev/null | head -n1 || true)"
          MANIFEST="packaging/dist/download_manifest.json"
          if [ -z "${DEB}" ] || [ ! -f "${DEB}" ] || [ ! -s "${DEB}" ]; then
            echo "::error::No .deb installer produced in packaging/dist — check build_installers.py (dpkg-deb missing?)"
            exit 1
          fi
          if [ ! -f "${MANIFEST}" ] || [ ! -s "${MANIFEST}" ]; then
            echo "::error::download_manifest.json missing or empty in packaging/dist"
            exit 1
          fi
          if ! grep -qF "$(basename "${DEB}")" "${MANIFEST}"; then
            echo "::error::download_manifest.json does not reference $(basename "${DEB}")"
            exit 1
          fi
          echo "✅ Verified: $(basename "${DEB}") ($(stat -c %s "${DEB}") bytes) + download_manifest.json"

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          set -uo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          # หา tag ก่อนหน้า = tag semver ตัวที่ 2 นับจากบนสุด (เรียง version ใหม่ → เก่า)
          PREV_TAG="$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p' || true)"

          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..HEAD"
            CHANGELOG_TITLE="## 🚀 Changelog — ${PREV_TAG} → ${TAG}"
          else
            RANGE="HEAD"
            CHANGELOG_TITLE="## 🚀 Changelog — release แรก"
          fi

          git log --oneline --no-decorate "${RANGE}" > commits.tmp
          COUNT="$(wc -l < commits.tmp)"

          {
            echo "## Smart Nurse Call — Installers"
            echo ""
            echo "Build จาก \`packaging/build_installers.py\` (Pi OS ARM64)."
            echo ""
            echo "> สคริปต์นี้ build เฉพาะ \`.deb\` (รันบน Ubuntu) — สำหรับ Windows \`.exe\` (Inno Setup) และ"
            echo "> macOS \`.dmg/.pkg\` (py2app) ต้อง build บนเครื่องเป้าหมายตาม \`packaging/INSTALL.md\`"
            echo ""
            echo "---"
            echo ""
            echo "${CHANGELOG_TITLE} (${COUNT} commits)"
            echo ""
            section() {
              TYPE="$1"; LABEL="$2"
              MATCHES="$(grep -E "^[0-9a-f]+ ${TYPE}(\([^)]*\))?!?: " commits.tmp || true)"
              if [ -n "${MATCHES}" ]; then
                echo "### ${LABEL}"
                echo ""
                echo "${MATCHES}" | sed -E "s/^[0-9a-f]+ ${TYPE}(\([^)]*\))?!?: /- /"
                echo ""
              fi
            }
            section feat "✨ Features"
            section fix "🐛 Bug Fixes"
            section docs "📝 Documentation"
            section ci "🔧 CI / Release"
            section chore "🧹 Chores"
            section refactor "♻️ Refactoring"
            section perf "⚡ Performance"
            section test "🧪 Tests"
            section build "📦 Build"
            OTHERS="$(grep -vE "^[0-9a-f]+ (feat|fix|docs|ci|chore|refactor|perf|test|build)(\([^)]*\))?!?: " commits.tmp || true)"
            if [ -n "${OTHERS}" ]; then
              echo "### 📄 Other"
              echo ""
              echo "${OTHERS}" | sed -E 's/^[0-9a-f]+ /- /'
              echo ""
            fi
          } > release-body.md
          rm -f commits.tmp
          echo "body_path=${PWD}/release-body.md" >> "${GITHUB_OUTPUT}"

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SNC ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          files: |
            packaging/dist/snclite_*_arm64.deb
            packaging/dist/download_manifest.json
          draft: false