# ============================================================================
# verify-projects.conf — รายชื่อโปรเจกต์สำหรับ verify-system.sh
# ----------------------------------------------------------------------------
# หนึ่งโปรเจกต์ต่อบรรทัด คั่นด้วย | (13 ช่อง) — ช่องใดว่าง = ใช้ค่า default:
#
#   name | root | core_dirs | services | health_url | old_dirs |
#   key_files | key_name | proxy_port | pbx_host | pbx_port | git_branch | cloud_url
#
#   core_dirs  : ชื่อ dir 5-Core (คั่นช่องว่าง)      default: api app pbx ops doc
#   services   : systemd services (คั่นช่องว่าง)      ว่าง = ข้ามตรวจ
#   health_url : endpoint ตรวจสุขภาพ                  ว่าง = ข้ามตรวจ
#   old_dirs   : dir เก่าที่ควรไม่มี (คั่นช่องว่าง)    ว่าง = ข้ามตรวจ
#   key_files  : .env ที่ต้องมี key ตรงกัน (คั่นช่องว่าง) ว่าง = ข้ามตรวจ
#   key_name   : ชื่อตัวแปร key                       default: SNC_API_KEY
#   proxy_port : TCP port ที่ต้องฟัง                  ว่าง = ข้ามตรวจ
#   pbx_host/pbx_port : TCP ปลายทางที่ต้องเชื่อม      host ว่าง = ข้ามตรวจ
#   git_branch : branch ที่ต้อง sync                  default: main
#   cloud_url  : Cloud Run base URL (ตรวจ health/auth/dashboard)  ว่าง = ข้าม
# ============================================================================

